
name: Build Hiragana Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HiraganaArenaAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil proyek dari GitHub
        uses: actions/checkout@v4

      - name: Ekstrak proyek Android
        run: |
          test -f HiraganaArenaAndroid_Project.zip
          unzip -o HiraganaArenaAndroid_Project.zip

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        working-directory: HiraganaArenaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: HiraganaArena-APK
          path: HiraganaArenaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

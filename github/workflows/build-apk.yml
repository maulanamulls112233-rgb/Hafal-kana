
name: Build Hiragana Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip HiraganaArenaAndroid_Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: HiraganaArenaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp HiraganaArenaAndroid/app/build/outputs/apk/debug/app-debug.apk HiraganaArena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiraganaArena-APK
          path: HiraganaArena.apk
